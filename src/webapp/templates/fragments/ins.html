<section class="section">
  <h2 class="section-heading">Insider Transactions</h2>
  {% if rows %}
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Insider</th>
          <th>Position</th>
          <th>Transaction</th>
          <th class="num">Shares</th>
          <th class="num">Value</th>
        </tr>
      </thead>
      <tbody>
        {% for row in rows %}
        <tr>
          <td class="row-label">{{ row.date }}</td>
          <td>{{ row.insider }}</td>
          <td>{{ row.position }}</td>
          <td class="{{ row.tint_class }}">{{ row.text }}</td>
          <td class="num">{{ row.shares }}</td>
          <td class="num">{{ row.value }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
  <p class="empty-row">No insider transactions collected.</p>
  {% endif %}
</section>
