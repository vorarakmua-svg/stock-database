<div class="chip-row" id="hp-controls">
  {% for rk in range_options %}
  <button type="button" class="chip{% if rk == range %} chip-active{% endif %}"
    hx-get="/ui/stocks/{{ ticker }}/hp?range={{ rk }}" hx-target="#panel"
  >{{ rk }}</button>
  {% endfor %}
  <a class="btn btn-sm" href="{{ csv_href }}">DOWNLOAD CSV</a>
</div>

<section class="section">
  <h2 class="section-heading">Historical Prices</h2>
  {% if rows %}
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>Date</th>
          <th class="num">Open</th>
          <th class="num">High</th>
          <th class="num">Low</th>
          <th class="num">Close</th>
          <th class="num">Volume</th>
        </tr>
      </thead>
      <tbody>
        {% for row in rows %}
        <tr>
          <td class="row-label hp-bar-date">{{ row.date }}</td>
          <td class="num">{{ row.open }}</td>
          <td class="num">{{ row.high }}</td>
          <td class="num">{{ row.low }}</td>
          <td class="num">{{ row.close }}</td>
          <td class="num">{{ row.volume }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
  <div class="empty-state">No price history collected.</div>
  {% endif %}
</section>
