[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-database"
version = "0.1.0"
description = "Collect US stock fundamentals from free sources (Yahoo Finance, SEC EDGAR, FRED) for valuation modeling."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "vorarakmua-svg" }]
keywords = ["stocks", "finance", "sec-edgar", "valuation", "dcf"]

dependencies = [
    "yfinance>=0.2.50",
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.8", "mypy>=1.8", "types-requests", "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "jinja2>=3.1", "python-multipart>=0.0.9"]

[project.scripts]
stock-data = "src.main:main"
stock-web = "src.webapp.__main__:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestDeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
# mypy >= 2.0 dropped python_version = "3.9" (must be 3.10+). Runtime 3.9
# compatibility is still enforced by ruff (target py39) and the py3.9 CI job.
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
# Type-check the new, fully-typed standardization/storage modules. The legacy
# fetchers/parsers are not yet annotated; they are checked only as silent imports.
files = [
    "src/mappings/canonical.py",
    "src/mappings/sectors.py",
    "src/models/canonical.py",
    "src/validation",
    "src/parsers/derived_fields.py",
    "src/parsers/metric_utils.py",
    "src/parsers/sector_metrics.py",
    "src/parsers/ttm.py",
    "src/parsers/unmapped.py",
    "src/analysis",
    "src/exporters/sqlite_store.py",
    "src/query/asof.py",
    "src/query/pit_metrics.py",
    "src/webapp",
]

# click 8.x uses `match` (3.10+) which mypy's 3.9 parser rejects with a syntax
# error — even when follow_imports="silent". Skip parsing click source entirely.
[[tool.mypy.overrides]]
module = ["click", "click.*"]
follow_imports = "skip"

# numpy >= 2.5 stubs use PEP 695 `type` statements (3.12+) which any lower
# python_version target rejects as a syntax error — same failure mode as click.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
