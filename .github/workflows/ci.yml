name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest (26.04) has no Python 3.9 in setup-python.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,web]"

      - name: Lint (ruff)
        run: ruff check src/ diagnose.py tests/

      - name: Type-check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest
